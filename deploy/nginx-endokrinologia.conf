# nginx – statický web Endokrinológia Žilina na Hetzner serveri (37.27.84.175).
# Kanonická adresa: https://endokrinologia-zilina.sk (bez www).
# www a dočasná adresa endo.37-27-84-175.sslip.io presmerujú (301) na kanonickú.
# Nginx sa viaže na verejnú IP, lebo na 443 počúva aj Tailscale (nginx 1.24 → "ssl http2").

# HTTP: overovanie certifikátov + presmerovanie všetkého na HTTPS doménu
server {
    listen 37.27.84.175:80;
    server_name endokrinologia-zilina.sk www.endokrinologia-zilina.sk endo.37-27-84-175.sslip.io;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://endokrinologia-zilina.sk$request_uri; }
}

# Hlavný web
server {
    listen 37.27.84.175:443 ssl http2;
    server_name endokrinologia-zilina.sk;

    root /var/www/endokrinologia;
    index index.html;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/endokrinologia-zilina.sk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/endokrinologia-zilina.sk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Bezpečnostné hlavičky (rovnaký základ ako aksamec.sk)
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # Kompresia – menej dát = rýchlejší web = lepšie hodnotenie v Google
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml image/svg+xml application/manifest+json text/markdown;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # CSS/JS majú v odkaze ?v=dátum, obrázky a fonty sa nemenia → dlhá cache
    location ~* \.(css|js|webp|jpg|jpeg|png|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
        try_files $uri =404;
    }

    # HTML, sitemap, robots, llms.txt – vždy čerstvé
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ =404;
    }

    # Staré adresy z GitHub Pages → koreň (žiadne stratené odkazy)
    location ^~ /Endokrinologia_web/ {
        rewrite ^/Endokrinologia_web/(.*)$ /$1 permanent;
    }

    location ~ /\.(?!well-known) { deny all; }   # .git, .DS_Store …

    error_page 404 /404.html;
}

# Dočasná adresa → doména
server {
    listen 37.27.84.175:443 ssl http2;
    server_name endo.37-27-84-175.sslip.io;
    ssl_certificate     /etc/letsencrypt/live/endo.37-27-84-175.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/endo.37-27-84-175.sslip.io/privkey.pem;
    return 301 https://endokrinologia-zilina.sk$request_uri;
}

# www → bez www
server {
    listen 37.27.84.175:443 ssl http2;
    server_name www.endokrinologia-zilina.sk;
    ssl_certificate     /etc/letsencrypt/live/endokrinologia-zilina.sk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/endokrinologia-zilina.sk/privkey.pem;
    return 301 https://endokrinologia-zilina.sk$request_uri;
}
