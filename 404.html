<head>

    <style>
        body { min-height: 100vh; display: grid; place-items: center; background: var(--bg-alt); }
        .nf { max-width: 560px; padding: 48px 24px; text-align: center; }
        .nf-code { font-family: var(--font-h); font-weight: 800; font-size: clamp(4rem, 14vw, 7rem); line-height: 1;
                   background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .nf h1 { font-family: var(--font-h); font-size: 1.6rem; margin: 16px 0 8px; color: var(--text); }
        .nf p { color: var(--muted); margin-bottom: 28px; }
        .nf-links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .nf-links a.alt { color: var(--primary-dark); font-weight: 600; align-self: center; }
    </style>
</head>

    <main class="nf">
        <div class="nf-code" aria-hidden="true">404</div>

        <div class="nf-links">
